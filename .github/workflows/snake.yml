# Redraws the contribution snake every day and publishes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0e0f11&color_dots=#ebedf0,#c9dbe8,#9fc0d8,#5f8fb1,#2e5878
            dist/snake-dark.svg?palette=github-dark&color_snake=#9fc0d8&color_dots=#16181b,#1d3242,#2f5873,#5f8fb1,#9fc0d8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
